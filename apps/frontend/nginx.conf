# Firewall de perímetro do frontend (contexto http: este ficheiro é incluído em conf.d).
# Blocklist de IPs maliciosos gerada por infra/scripts/update-nginx-blocklist.sh.
geo $aegis_blocked {
    default 0;
    include /etc/nginx/aegis-blocklist.conf;
}
limit_req_zone $binary_remote_addr zone=aegis_req:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=aegis_conn:10m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    limit_req zone=aegis_req burst=80 nodelay;
    limit_req_status 429;
    limit_conn aegis_conn 40;
    limit_conn_status 429;

    if ($aegis_blocked) { return 403; }
    # O site é estático: só leitura.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # connect-src https: permite uma API noutra origem HTTPS (VITE_API_BASE_URL).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # Ficheiros escondidos e de configuração nunca são servidos.
    location ~ /\.(?!well-known/) { return 404; }
    location ~* \.(?:env|git|bak|old|sql|sqlite3?|ini|log|sh|py|php|conf|ya?ml|toml|lock)$ { return 404; }

    # Assets com hash no nome: cache longa. "expires" não usa add_header, por isso os
    # cabeçalhos de segurança acima continuam a ser herdados.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
