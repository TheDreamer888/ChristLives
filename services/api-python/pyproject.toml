[project]
name = "aegis-api"
version = "0.1.0"
description = "Aegis security and authentication API."
authors = [
    {name = "DavidTheEngenieer"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "starlette (>=1.3.1,<2.0.0)",
    "uvicorn[standard] (>=0.52.1,<0.53.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "orjson (>=3.11.9,<4.0.0)",
    "uvloop (>=0.22.1,<0.23.0) ; sys_platform != 'win32'",
    "httptools (>=0.8.0,<0.9.0)",
    "brotli (>=1.2.0,<2.0.0)",
    "azure-identity (>=1.25.3,<2.0.0)",
    "azure-storage-blob (>=12.30.0,<13.0.0)",
    "azure-keyvault-secrets (>=4.11.3,<5.0.0)",
    "azure-monitor-opentelemetry (>=1.8.9,<2.0.0)",
    "cryptography (>=50.0.0,<51.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "pyjwt (>=2.13.0,<3.0.0)",
    "prometheus-client (>=0.26.0,<0.27.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "aiohttp (>=3.14.3,<4.0.0)",
    "sqlalchemy[asyncio] (>=2.0.51,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.18.5,<2.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "aioredis (>=2.0.1,<3.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "kombu (>=5.6.2,<6.0.0)",
    "flower (>=2.0.1,<3.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "structlog (>=26.1.0,<27.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "prometheus-fastapi-instrumentator (>=8.1.0,<9.0.0)",
    "sentry-sdk[fastapi] (>=2.66.1,<3.0.0)",
    "webauthn (>=2.5.0,<3.0.0)"
]

[tool.poetry]
packages = [{ include = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^0.23.0"
pytest-cov = "^5.0.0"
ruff = "^0.16.1"
mypy = "^1.11.0"
pre-commit = "^3.8.0"
bandit = "^1.7.9"
safety = "^3.2.0"
mkdocs = "^1.6.0"
mkdocs-material = "^9.5.0"
pytest-benchmark = "^4.0.0"
ipython = "^8.26.0"
rich = "^15.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

