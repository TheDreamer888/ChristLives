services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-protectia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-protectia}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-python:
    build:
      context: ./services/api-python
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./services/api-python/.env
        required: false
      - path: ./.env.auth
        required: false
    environment:
      ENV: ${ENV:-development}
      DEBUG: ${DEBUG:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174}
      DATABASE_URL: ""
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-protectia}
      DATABASE_USER: ${POSTGRES_USER:-protectia}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      PUBLIC_FRONTEND_URL: ${PUBLIC_FRONTEND_URL:-http://localhost:5173}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_STARTER: ${STRIPE_PRICE_STARTER:-}
      STRIPE_PRICE_GROWTH: ${STRIPE_PRICE_GROWTH:-}
      STRIPE_PRICE_SCALE: ${STRIPE_PRICE_SCALE:-}
      SALES_LEAD_ENC_KEY: ${SALES_LEAD_ENC_KEY:-}
      SALES_LEAD_DB_PATH: /app/src/app/data/sales_leads.sqlite3
      SALES_LEAD_RETENTION_DAYS: ${SALES_LEAD_RETENTION_DAYS:-30}
      ASSISTANT_REQUESTS_PER_HOUR: ${ASSISTANT_REQUESTS_PER_HOUR:-20}
      AUTH_REQUESTS_PER_MINUTE: ${AUTH_REQUESTS_PER_MINUTE:-10}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - api_python_data:/app/src/app/data
    depends_on:
      api-migrate:
        condition: service_completed_successfully

  api-migrate:
    build:
      context: ./services/api-python
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    env_file:
      - path: ./services/api-python/.env
        required: false
    environment:
      DATABASE_URL: ""
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-protectia}
      DATABASE_USER: ${POSTGRES_USER:-protectia}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy

  api-rust:
    build:
      context: ./services/api-rust
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-protectia}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-protectia}
      PORT: 3000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  api-dotnet:
    build:
      context: ./services/api-dotnet
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      Cors__AllowedOrigins: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174}

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      api-python:
        condition: service_started
      api-rust:
        condition: service_started
      api-dotnet:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  api_python_data:
